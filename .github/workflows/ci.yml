name: CI

on:
  push:
    branches: [main]
    # Changes under docs/ ship nothing and no test reads them.
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: npm test (Windows)
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
        env:
          # A hosted runner is slower than a developer machine; a green run takes about 40 minutes in all.
          BELAY_TEST_PHASE1_TIMEOUT_MS: '2700000'
