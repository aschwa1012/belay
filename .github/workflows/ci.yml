name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: npm test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
        env:
          # A hosted runner is slower than a developer machine: give the main test phase an hour.
          BELAY_TEST_PHASE1_TIMEOUT_MS: '3600000'
